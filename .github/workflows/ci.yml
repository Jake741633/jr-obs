name: JR OS CI

on:
  push:
    branches: [main, jr-os-v2]
  pull_request:
    branches: [main, jr-os-v2]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Generate dependency remediation
        run: npm audit fix --package-lock-only
      - name: Create unreferenced Git blob
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          encoded="$(base64 -w 0 package-lock.json)"
          payload="$(jq -n --arg content "$encoded" '{content:$content,encoding:"base64"}')"
          response="$(curl --fail-with-body -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${{ github.repository }}/git/blobs \
            -d "$payload")"
          echo "REMEDIATED_LOCK_BLOB_SHA=$(jq -r .sha <<<"$response")"
      - name: Stop diagnostic run
        run: exit 1
