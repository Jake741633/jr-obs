name: JR OS CI

on:
  push:
    branches: [main, jr-os-v2]
  pull_request:
    branches: [main, jr-os-v2]

permissions:
  contents: read

jobs:
  upgrade-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/supabase-rehearsal/package-lock.json
      - name: Install isolated rehearsal dependencies
        run: npm ci --ignore-scripts --prefix scripts/supabase-rehearsal
      - name: Audit rehearsal dependencies
        run: npm audit --audit-level=moderate --prefix scripts/supabase-rehearsal
      - name: Rehearse the existing-data upgrade and synthetic backup restore
        run: npm test --prefix scripts/supabase-rehearsal

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
