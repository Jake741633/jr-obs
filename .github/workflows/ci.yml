name: JR OS CI

on:
  push:
    branches: [main, jr-os-v2]
  pull_request:
    branches: [main, jr-os-v2]

permissions:
  contents: read

jobs:
  full-supabase-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/supabase-rehearsal/package-lock.json
      - name: Install isolated rehearsal dependencies
        run: npm ci --ignore-scripts --prefix scripts/supabase-rehearsal
      - name: Audit rehearsal dependencies
        run: npm audit --audit-level=moderate --prefix scripts/supabase-rehearsal
      - name: Rehearse the upgrade on a restored full Supabase database
        run: node scripts/supabase-rehearsal/full-stack.mjs

  upgrade-rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/supabase-rehearsal/package-lock.json
      - name: Install isolated rehearsal dependencies
        run: npm ci --ignore-scripts --prefix scripts/supabase-rehearsal
      - name: Audit rehearsal dependencies
        run: npm audit --audit-level=moderate --prefix scripts/supabase-rehearsal
      - name: Rehearse the existing-data upgrade and synthetic backup restore
        run: npm test --prefix scripts/supabase-rehearsal

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        run: npm audit --audit-level=moderate
      - name: Test
        run: npm test
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
