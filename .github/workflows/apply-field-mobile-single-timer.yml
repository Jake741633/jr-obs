name: Apply branch-only field timer patch

on:
  push:
    branches:
      - fix/field-mobile-single-timer-20260827
    paths:
      - .github/workflows/apply-field-mobile-single-timer.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply exact audited patch
        run: node scripts/apply-field-mobile-single-timer.mjs

      - name: Commit patched field page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/field/page.tsx
          git diff --cached --quiet && { echo "Expected field page changes were not produced"; exit 1; }
          git commit -m "Enforce one active mobile field timer"
          git push origin "HEAD:${GITHUB_REF_NAME}"
