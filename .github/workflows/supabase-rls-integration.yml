name: JR OS Supabase RLS Integration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rls-integration:
    runs-on: ubuntu-latest
    environment: supabase-test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run multi-tenant RLS integration tests
        run: npm run test:rls
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          SUPABASE_TEST_CONFIRM: JR_OS_RLS_TEST
