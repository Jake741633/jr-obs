name: JR OS Supabase RLS Integration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type JR_OS_RLS_TEST to confirm this is the dedicated disposable test project
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: jr-os-supabase-rls-test
  cancel-in-progress: false

jobs:
  rls-integration:
    if: ${{ inputs.confirmation == 'JR_OS_RLS_TEST' }}
    runs-on: ubuntu-latest
    environment: supabase-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run multi-tenant RLS and private Storage integration tests
        run: npm run test:rls
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          SUPABASE_TEST_CONFIRM: ${{ inputs.confirmation }}
      - name: Clean disposable Supabase test data
        if: ${{ always() }}
        run: node --test-force-exit tests/supabase-rls.cleanup.mjs
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          SUPABASE_TEST_CONFIRM: ${{ inputs.confirmation }}
