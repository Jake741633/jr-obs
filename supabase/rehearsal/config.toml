# Copied only into a fresh temporary CI project. Never link this to a hosted project.
project_id = "REHEARSAL_PROJECT_ID"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "5MiB"

[analytics]
enabled = false

[studio]
enabled = false

[realtime]
enabled = false

[edge_runtime]
enabled = false
